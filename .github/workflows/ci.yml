name: Verify the verse checker
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install the pinned development tools
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Lint
        run: python3 -m ruff check .
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise the composite action with a real hexameter
        id: smoke
        uses: ./
        with:
          files: examples/hexameter.txt
          expected-meter: hexameter
          strict: 'true'
      - name: Check the public outputs
        env:
          PASSED: ${{ steps.smoke.outputs.passed }}
          CHECKED: ${{ steps.smoke.outputs.checked-lines }}
        run: test "$PASSED" = true && test "$CHECKED" = 1
      # After the smoke test, so the composite action itself runs on the runner's own python3.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Build an engine for integration tests
        id: engine
        run: python3 scripts/build_engine.py
      - name: Install the pinned test runner
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify strict mode, reports, path boundaries and PR-title handling
        env:
          VERSE_ENGINE_JAR: ${{ steps.engine.outputs.jar }}
        run: python3 -m pytest -v
